<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Trackio Lens</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font:16px system-ui,sans-serif;background:#f4f6fa;color:#182338}main{width:min(100%,400px);background:white;padding:32px;border:1px solid #dce2ed;border-radius:16px;box-shadow:0 12px 40px #1823380a}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 8px}p{line-height:1.6;color:#596579}label{display:block;margin:22px 0 8px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #bac4d5}button{margin-top:26px;background:#244fc2;color:white;border:0;cursor:pointer;font-weight:600}button:disabled{opacity:.6}#error{color:#b42318;min-height:24px;margin-bottom:0}small{color:#6b7280}
</style>
<main><h1>Trackio Lens</h1><p>Sign in to view your experiments.</p><form>
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button>Sign in</button><p id="error" role="alert"></p></form><small>Independent frontend for Trackio</small></main>
<script>
document.querySelector('form').addEventListener('submit',async event=>{
event.preventDefault();const button=document.querySelector('button');button.disabled=true;const error=document.querySelector('#error');error.textContent='';
try{const response=await fetch('/__lens/login',{method:'POST',headers:{'Content-Type':'application/json','X-Lens-Login':'1'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await response.json();if(!response.ok)throw Error(data.error);const next=new URLSearchParams(location.search).get('next')||'/';const target=new URL(next,location.origin);location.replace(target.origin===location.origin?target.pathname+target.search:'/');}catch(e){error.textContent=e.message||'Unable to sign in. Please retry.';button.disabled=false;}
});
</script></html>
