[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trackio-lens"
version = "0.1.0"
description = "Independent Trackio frontend with single-instance access isolation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["trackio==0.44.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.9.3", "playwright==1.60.0"]

[project.scripts]
trackio-lens = "trackio_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trackio_lens"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

